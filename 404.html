<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121615">
  <title>404 · Seite nicht gefunden | notedbit</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/portfolio.css">
  <style>
    .not-found { min-height: 70vh; display: grid; place-items: center; padding: 4rem 1.5rem; }
    .not-found-inner { width: min(100%, 42rem); }
    .not-found h1 { margin-block: .5rem 1rem; }
    .not-found p { max-width: 38rem; }
    .not-found a { display: inline-block; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <p>404 · notedbit</p>
      <h1>Seite nicht gefunden / Page not found</h1>
      <p>Diese Adresse existiert nicht oder wurde geändert.</p>
      <p lang="en">This page does not exist or its address has changed.</p>
      <a href="/">Zur Startseite / Back to home</a>
    </div>
  </main>
</body>
</html>
